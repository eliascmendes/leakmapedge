name: testes

on:
  push:
  pull_request:

jobs:
  trilha-de-software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Dependencias
        run: |
          pip install numpy pyserial
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Trilha completa, testes do Python e da placa simulada, simulacao do Verilog e paridade do JavaScript
        run: python rodar_software.py

  backend-da-bancada:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leakmap
          POSTGRES_PASSWORD: leakmap
          POSTGRES_DB: leakmap
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LEAKMAP_BANCO_DE_TESTE: postgresql://leakmap:leakmap@127.0.0.1:5432/leakmap
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias do backend
        run: pip install -r 08_backend/requirements.txt

      - name: Testes do backend (gerador, bancada ao vivo, REST, WebSocket, webhook e historico em PostgreSQL)
        run: python -m unittest discover -s 08_backend/testes -p "teste_*.py"

  ambiente-do-tsnet:
    # numa maquina limpa: instala as versoes congeladas e refaz simulacoes gravadas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ambiente do TSNet e conferencia contra as simulacoes gravadas
        run: bash 02_bancada/ambiente/preparar_ambiente.sh "$HOME/leakmap_env" --completo
