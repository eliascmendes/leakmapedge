<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bancada virtual · teste</title>
<style>
  :root { --fundo:#0d1110; --painel:#151b19; --linha:#2a332f; --texto:#e4ebe6; --fraco:#8c978f;
          --a:#b3f000; --b:#2fd6e8; --c:#f5a524; --d:#e86bd1; --alerta:#ff5a4f; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--fundo); color:var(--texto); font:14px/1.45 system-ui, sans-serif; }
  header { padding:12px 16px; border-bottom:1px solid var(--linha); display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  header b { font-size:15px; } .faixa { background:var(--c); color:#000; font-weight:700; padding:2px 8px; letter-spacing:.08em; }
  main { display:grid; grid-template-columns:minmax(0,320px) minmax(0,1fr); gap:16px; padding:16px; }
  @media (max-width: 800px) { main { grid-template-columns:minmax(0,1fr); } }
  section { background:var(--painel); border:1px solid var(--linha); padding:12px; margin-bottom:12px; }
  h2 { font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--fraco); margin:0 0 8px; }
  label { display:block; color:var(--fraco); font-size:12px; margin-top:8px; }
  input, select, button { font:inherit; color:var(--texto); background:var(--fundo); border:1px solid var(--linha); padding:6px 8px; }
  input, select { width:100%; } button { cursor:pointer; margin:6px 6px 0 0; } button:hover { border-color:var(--a); }
  .linha2 { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  #nivel { font-size:22px; font-weight:700; } #nivel.alerta { color:var(--alerta); }
  canvas { width:100%; height:220px; display:block; background:var(--fundo); }
  pre { white-space:pre-wrap; word-break:break-word; font-size:12px; max-height:260px; overflow:auto; margin:0; }
  .legenda span { margin-right:12px; font-size:12px; } .mono { font-family:ui-monospace, monospace; font-size:12px; }
  ul { margin:0; padding-left:18px; } li { margin-bottom:6px; }
</style>
</head>
<body>
<header>
  <b>LEAKMAP Edge · bancada virtual (página de teste)</b>
  <span class="faixa" id="faixa">SIMULAÇÃO</span>
  <span class="mono" id="conexao">desconectado</span>
  <span class="mono" id="relogio"></span>
</header>
<main>
  <div>
    <section>
      <h2>Conexão</h2>
      <label>Chave dos comandos (cabeçalho X-LEAKMAP-Chave)</label>
      <input id="chave" type="password" autocomplete="off" placeholder="vazia no uso local">
      <label>Perfil do WebSocket</label>
      <select id="perfil"><option value="demonstracao">demonstracao (com a verdade)</option><option value="operador">operador</option></select>
      <button id="conectar">Conectar</button>
    </section>
    <section>
      <h2>Linha e transmissor</h2>
      <label>Linha</label><select id="linha"></select>
      <label>Transmissor</label><select id="transmissor"></select>
    </section>
    <section>
      <h2>Vazamento</h2>
      <div class="linha2">
        <div><label>Trecho</label><select id="trecho"></select></div>
        <div><label>Posição (m)</label><input id="posicao" type="number" value="320" step="1"></div>
      </div>
      <div class="linha2">
        <div><label>Tamanho</label><select id="tamanho"><option>grande</option><option>pequeno</option></select></div>
        <div><label>Fonte</label><select id="fonte"><option>gerador</option><option>tsnet</option></select></div>
      </div>
      <button id="romper">Romper</button><button id="reparar">Reparar</button>
    </section>
    <section>
      <h2>Manobra</h2>
      <div class="linha2">
        <div><label>Equipamento</label><select id="equipamento"></select></div>
        <div><label>Ação</label><select id="acao"><option>abrir</option><option>fechar</option><option>partir</option><option>parar</option></select></div>
      </div>
      <label><input id="registrar" type="checkbox" checked style="width:auto"> registrar a operação (sistema de controle)</label>
      <button id="manobrar">Operar</button>
    </section>
    <section>
      <h2>Sensores e gás</h2>
      <div class="linha2">
        <div><label>Sensor</label><select id="sensor"></select></div>
        <div><label>Falha</label><select id="falha"><option>cabo_rompido</option><option>travado</option><option>nenhuma</option></select></div>
      </div>
      <button id="estragar">Aplicar</button>
      <label><input id="gas" type="checkbox" style="width:auto"> sensor de gás acusa vapor</label>
      <label><input id="roteiro" type="checkbox" style="width:auto"> roteiro automático (um cenário a cada 20 s)</label>
    </section>
  </div>
  <div>
    <section>
      <h2>Pressão nos sensores (bar)</h2>
      <canvas id="grafico" width="900" height="220"></canvas>
      <div class="legenda" id="legenda"></div>
    </section>
    <section>
      <h2>Último evento</h2>
      <div id="nivel">—</div>
      <div id="resumo"></div>
      <p id="explicacao"></p>
      <canvas id="sinal" width="900" height="160"></canvas>
    </section>
    <section><h2>Histórico</h2><ul id="historico"></ul></section>
    <section><h2>Estado e saúde</h2><pre id="estado"></pre></section>
    <section><h2>Últimas mensagens</h2><pre id="log"></pre></section>
  </div>
</main>
<script>
(function () {
  "use strict";
  var CORES = ["#b3f000", "#2fd6e8", "#f5a524", "#e86bd1"];
  var $ = function (id) { return document.getElementById(id); };
  var ws = null, serie = {}, linhaAtiva = null, espera = 1000;
  var JANELA_S = 10;

  function log(texto) {
    var p = $("log"); p.textContent = (texto + "\n" + p.textContent).slice(0, 6000);
  }
  function api(metodo, rota, corpo) {
    var cab = { "Content-Type": "application/json" };
    if ($("chave").value) { cab["X-LEAKMAP-Chave"] = $("chave").value; }
    return fetch(rota, { method: metodo, headers: cab, body: corpo ? JSON.stringify(corpo) : undefined })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) { log("ERRO " + r.status + ": " + JSON.stringify(j)); } return j; }); });
  }
  function opcoes(sel, itens, valor) {
    sel.innerHTML = "";
    itens.forEach(function (i) { var o = document.createElement("option"); o.value = i[0]; o.textContent = i[1]; sel.appendChild(o); });
    if (valor !== undefined) { sel.value = valor; }
  }
  function usarLinha(l, estado) {
    linhaAtiva = l; serie = {};
    l.sensores.forEach(function (s) { serie[s.id] = []; });
    opcoes($("trecho"), l.trechos.map(function (t) { return [t.id, t.id + " (" + t.vazamento.de_s_m + " a " + t.vazamento.ate_s_m + " m)"]; }));
    opcoes($("equipamento"), l.equipamentos.map(function (e) { return [e.id, e.id + " · " + e.tipo]; }));
    opcoes($("sensor"), l.sensores.map(function (s) { return [s.id, s.nome]; }));
    $("legenda").innerHTML = l.sensores.map(function (s, k) {
      return '<span style="color:' + CORES[k] + '">■ ' + s.nome + "</span>"; }).join("");
    if (estado) { $("linha").value = estado.linha; $("transmissor").value = estado.transmissor; }
  }
  function mostrarEstado(e) {
    $("estado").textContent = JSON.stringify(e, null, 1);
    $("gas").checked = e.gas && e.gas.acusando;
    $("roteiro").checked = !!e.roteiro;
    $("relogio").textContent = "t = " + e.t_s.toFixed(1) + " s";
  }
  function mostrarEvento(m) {
    var e = m.evento, v = m.verdade;
    $("nivel").textContent = e.nivel + " · " + e.classificacao;
    $("nivel").className = (e.nivel === "provavel" || e.nivel === "confirmado") ? "alerta" : "";
    $("resumo").textContent = (e.posicao_m !== null ? "estimado: " + e.trecho + " " + e.posicao_m.toFixed(2) + " m" : "sem posição") +
      (e.lado ? " · lado " + e.lado : "") + (v ? " · real: " + (v.tipo === "falha_de_sensor" ? "falha do sensor " + v.sensor :
      v.tipo + " " + v.trecho + " " + v.s_m + " m") + (v.erro_m !== undefined ? " · erro " + v.erro_m.toFixed(2) + " m" : "") : "");
    $("explicacao").textContent = e.explicacao;
    var li = document.createElement("li");
    li.textContent = e.instante_utc.slice(11, 19) + " · " + e.nivel + " · " + e.classificacao + (e.posicao_m !== null ? " · " + e.posicao_m.toFixed(1) + " m" : "");
    $("historico").insertBefore(li, $("historico").firstChild);
    fetch("/api/eventos/" + e.id + "/sinal").then(function (r) { return r.json(); }).then(desenharSinal);
  }
  function desenharLinhas(canvas, series, t0, t1, marcas) {
    var ctx = canvas.getContext("2d"), W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    var min = Infinity, max = -Infinity;
    Object.keys(series).forEach(function (k) { series[k].forEach(function (p) { if (p[1] < min) min = p[1]; if (p[1] > max) max = p[1]; }); });
    if (!isFinite(min)) { return; }
    if (max - min < 0.05) { max += 0.025; min -= 0.025; }
    var x = function (t) { return (t - t0) / (t1 - t0) * (W - 50) + 45; };
    var y = function (v) { return H - 12 - (v - min) / (max - min) * (H - 24); };
    ctx.fillStyle = "#8c978f"; ctx.font = "11px monospace";
    ctx.fillText(max.toFixed(2), 2, 12); ctx.fillText(min.toFixed(2), 2, H - 4);
    Object.keys(series).forEach(function (k, i) {
      ctx.strokeStyle = CORES[i]; ctx.lineWidth = 1.5; ctx.beginPath();
      series[k].forEach(function (p, j) { if (j) ctx.lineTo(x(p[0]), y(p[1])); else ctx.moveTo(x(p[0]), y(p[1])); });
      ctx.stroke();
      if (marcas && marcas[k] !== null && marcas[k] !== undefined) {
        ctx.setLineDash([4, 3]); ctx.beginPath(); ctx.moveTo(x(marcas[k]), 0); ctx.lineTo(x(marcas[k]), H); ctx.stroke(); ctx.setLineDash([]);
      }
    });
  }
  function desenharGrafico() {
    if (!linhaAtiva) { return; }
    var fim = -Infinity;
    Object.keys(serie).forEach(function (k) { var s = serie[k]; if (s.length) fim = Math.max(fim, s[s.length - 1][0]); });
    if (isFinite(fim)) { desenharLinhas($("grafico"), serie, fim - JANELA_S, fim); }
  }
  function desenharSinal(s) {
    var series = {}, t1 = s.t0_s;
    Object.keys(s.pressao_bar).forEach(function (k) {
      series[k] = s.pressao_bar[k].map(function (v, i) { return [s.t0_s + i * s.periodo_s, v]; });
      t1 = Math.max(t1, s.t0_s + (s.pressao_bar[k].length - 1) * s.periodo_s);
    });
    desenharLinhas($("sinal"), series, s.t0_s, t1, s.marcas_de_chegada_s);
  }
  function conectar() {
    if (ws) { ws.onclose = null; ws.close(); }
    var url = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws?perfil=" + $("perfil").value + "&taxa=30";
    ws = new WebSocket(url);
    ws.onopen = function () { $("conexao").textContent = "conectado (" + $("perfil").value + ")"; espera = 1000; };
    ws.onclose = function () {
      $("conexao").textContent = "desconectado: tentando de novo em " + (espera / 1000) + " s";
      setTimeout(conectar, espera); espera = Math.min(espera * 2, 30000);
    };
    ws.onmessage = function (msg) {
      var m = JSON.parse(msg.data);
      if (m.tipo === "amostras") {
        Object.keys(m.pressao_bar).forEach(function (k) {
          if (!serie[k]) { return; }
          m.pressao_bar[k].forEach(function (v, i) { serie[k].push([m.t_s + i * m.periodo_s, v]); });
          var corte = m.t_s - JANELA_S;
          while (serie[k].length && serie[k][0][0] < corte) { serie[k].shift(); }
        });
        $("faixa").style.display = m.modo === "simulacao" ? "" : "none";
        $("relogio").textContent = "t = " + m.t_s.toFixed(1) + " s";
        return;
      }
      if (m.tipo !== "pulso") { log(m.tipo + " " + JSON.stringify(m).slice(0, 400)); }
      if (m.tipo === "boas_vindas") { usarLinha(m.linha, m.estado); mostrarEstado(m.estado); }
      else if (m.tipo === "estado") { mostrarEstado(m.estado); }
      else if (m.tipo === "evento") { mostrarEvento(m); }
    };
  }
  function montar() {
    fetch("/api/linhas").then(function (r) { return r.json(); }).then(function (j) {
      opcoes($("linha"), j.linhas.map(function (l) { return [l.id, l.nome]; }), j.linha_ativa);
    });
    fetch("/api/transmissores").then(function (r) { return r.json(); }).then(function (j) {
      opcoes($("transmissor"), j.map(function (t) { return [t.id, t.descricao]; }));
    });
    $("conectar").onclick = conectar;
    $("linha").onchange = function () { api("POST", "/api/bancada/linha", { linha: this.value }); };
    $("transmissor").onchange = function () { api("POST", "/api/bancada/transmissor", { transmissor: this.value }); };
    $("romper").onclick = function () {
      api("POST", "/api/bancada/vazamento", { trecho: $("trecho").value, s_m: Number($("posicao").value),
        tamanho: $("tamanho").value, fonte: $("fonte").value });
    };
    $("reparar").onclick = function () { api("POST", "/api/bancada/reparar", {}); };
    $("manobrar").onclick = function () {
      api("POST", "/api/bancada/equipamento", { equipamento: $("equipamento").value, acao: $("acao").value,
        registrar_operacao: $("registrar").checked });
    };
    $("estragar").onclick = function () { api("POST", "/api/bancada/sensor", { sensor: $("sensor").value, falha: $("falha").value }); };
    $("gas").onchange = function () { api("POST", "/api/bancada/gas", { acusando: this.checked }); };
    $("roteiro").onchange = function () {
      api("POST", "/api/bancada/roteiro", this.checked ? { roteiro: "demonstracao", intervalo_s: 20 } : { roteiro: null });
    };
    setInterval(desenharGrafico, 100);
    conectar();
  }
  montar();
})();
</script>
</body>
</html>
